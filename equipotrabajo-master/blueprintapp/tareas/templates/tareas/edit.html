{% extends 'base.html' %}

{% block title %}Editar Tarea{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-gradient bg-warning text-dark py-4">
                    <h3 class="mb-0 text-center">
                        <i class="bi bi-pencil-square me-2"></i>Editar Tarea
                    </h3>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('bp_tarea.edit', id=tarea.id) }}" method="POST">
                        <!-- Campo Descripción -->
                        <div class="mb-4">
                            <label for="descripcion" class="form-label fw-bold">
                                <i class="bi bi-card-text me-2 text-warning"></i>Descripción de la Tarea
                            </label>
                            <textarea 
                                class="form-control form-control-lg" 
                                id="descripcion" 
                                name="descripcion" 
                                rows="4" 
                                placeholder="¿Qué necesitas hacer?" 
                                required
                            >{{ tarea.descripcion }}</textarea>
                            <div class="form-text">Modifica la descripción si es necesario</div>
                        </div>

                        <!-- Checkbox Completado -->
                        <div class="mb-4">
                            <div class="form-check form-switch p-3 bg-light rounded">
                                <input 
                                    class="form-check-input" 
                                    type="checkbox" 
                                    id="completado" 
                                    name="completado"
                                    style="width: 3rem; height: 1.5rem;"
                                    {% if tarea.completado %}checked{% endif %}
                                >
                                <label class="form-check-label fw-bold ms-2" for="completado">
                                    <i class="bi bi-check-circle me-2 text-success"></i>
                                    Marcar como completada
                                </label>
                                <div class="form-text ms-5 mt-1">
                                    Si la tarea ya está realizada, márcala aquí
                                </div>
                            </div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="{{ url_for('bp_tarea.index') }}" 
                               class="btn btn-outline-secondary btn-lg px-4">
                                <i class="bi bi-x-circle me-2"></i>Cancelar
                            </a>
                            <button type="submit" 
                                    class="btn btn-warning btn-lg px-4">
                                <i class="bi bi-save me-2"></i>Actualizar Tarea
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
